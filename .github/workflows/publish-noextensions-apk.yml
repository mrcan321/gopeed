name: Publish direct APK downloads

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-noextensions-apk.yml'
  workflow_dispatch:

permissions:
  actions: read
  contents: write

jobs:
  publish:
    name: Publish verified No Extensions build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Download APKs from successful build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh run download 41083487014 --repo "$GITHUB_REPOSITORY" --name Gopeed-Android-NoExtensions-APKs --dir incoming
          test -s incoming/app-arm64-v8a-release.apk
          test -s incoming/app-release.apk
          mkdir -p publish
          cp incoming/app-arm64-v8a-release.apk publish/Gopeed-NoExtensions-arm64.apk
          cp incoming/app-release.apk publish/Gopeed-NoExtensions-universal.apk
          (cd publish && sha256sum Gopeed-NoExtensions-*.apk > SHA256SUMS.txt)

      - name: Create or refresh GitHub Latest Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag='noextensions-latest'
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$tag" publish/Gopeed-NoExtensions-arm64.apk --repo "$GITHUB_REPOSITORY" --clobber
            gh release edit "$tag" --repo "$GITHUB_REPOSITORY" --title "Gopeed No Extensions - ARM64 Latest" --latest
          else
            gh release create "$tag" publish/Gopeed-NoExtensions-arm64.apk \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "Gopeed No Extensions - ARM64 Latest" \
              --notes "Samsung Galaxy A34 5G ARM64 APK. Extensions disabled. Package com.gopeed.gopeed.noextensions. Build is debug-signed." \
              --latest
          fi
