name: Private Android Downloader (HTTPS to Downloads only)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: gopeed-private-android-latest
  cancel-in-progress: false

jobs:
  build:
    name: Build, audit and publish private Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14'

      - name: Build standalone Java-only Android application
        run: gradle -p private-android --no-daemon --stacktrace assembleRelease

      - name: Enforce Android APK privacy invariants
        shell: bash
        run: |
          set -euo pipefail
          apk='private-android/app/build/outputs/apk/release/app-release.apk'
          test -s "$apk"
          aapt="$ANDROID_HOME/build-tools/36.0.0/aapt"
          "$aapt" dump badging "$apk" | head -n 25
          "$aapt" dump permissions "$apk" > /tmp/permissions.txt
          cat /tmp/permissions.txt
          grep -q 'android.permission.INTERNET' /tmp/permissions.txt
          grep -q 'android.permission.FOREGROUND_SERVICE_DATA_SYNC' /tmp/permissions.txt
          if grep -Eq 'READ_EXTERNAL_STORAGE|WRITE_EXTERNAL_STORAGE|READ_MEDIA_|MANAGE_EXTERNAL_STORAGE|READ_CONTACTS|READ_SMS|ACCESS_FINE_LOCATION|ACCESS_COARSE_LOCATION|RECORD_AUDIO|CAMERA|REQUEST_INSTALL_PACKAGES|QUERY_ALL_PACKAGES' /tmp/permissions.txt; then
            echo 'Forbidden permission detected' >&2
            exit 1
          fi
          if unzip -Z1 "$apk" | grep -E '^lib/|flutter_assets|libgojni|libapp[.]so'; then
            echo 'Unexpected native engine or Flutter bundle' >&2
            exit 1
          fi
          unzip -Z1 "$apk" | grep -q '^classes.dex$'
          # Fail if the Java app grows any second network connection entrypoint.
          test "$(grep -REl '\.openConnection\(' private-android/app/src/main/java | wc -l)" -eq 1
          mkdir -p dist
          cp "$apk" dist/Gopeed-Gizli-Indirici.apk
          sha256sum dist/Gopeed-Gizli-Indirici.apk | tee dist/SHA256SUMS.txt

      - name: Upload APK as GitHub Actions artifact
        uses: actions/upload-artifact@v4
        with:
          name: Gopeed-Gizli-Indirici
          path: |
            dist/Gopeed-Gizli-Indirici.apk
            dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30

      - name: Publish private downloader as Latest GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          tag='privacy-only-latest'
          apk='dist/Gopeed-Gizli-Indirici.apk'
          title='Gopeed Gizli İndirici - Yalnızca HTTPS ve Download'
          cat > /tmp/release-notes.md <<'NOTES'
          PRIVACY-RESTRICTED ANDROID APK (Java-only, no Flutter/Go engine)

          - Only starts an HTTPS GET when the user taps Download.
          - Never follows redirects and never contacts an unrelated hostname.
          - Saves only to Android's public Download directory using MediaStore.
          - Does not request photos, general storage, contact, SMS, GPS or microphone access.
          - No analytics, updater, extension, script, API server, tracker, BitTorrent, telemetry, wake-on-boot or proxy.
          - Foreground data-sync service continues a user-initiated download in the background.
          - No source file reading. Incomplete downloads are deleted.
          - The Android OS and chosen download host necessarily see normal DNS/TLS/HTTPS network information while downloading. Device-wide system traffic is outside this app's control.
          - Only HTTPS direct-file URLs work; redirecting sites, magnet links and torrent links are intentionally unsupported.
          - The APK is release-mode but CI debug-signed with a temporary key; uninstall older builds if Android reports incompatible signatures.

          Source: private-android/
          NOTES
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$tag" "$apk" dist/SHA256SUMS.txt --repo "$GITHUB_REPOSITORY" --clobber
            gh release edit "$tag" --repo "$GITHUB_REPOSITORY" --title "$title" --notes-file /tmp/release-notes.md --latest
          else
            gh release create "$tag" "$apk" dist/SHA256SUMS.txt \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "$title" \
              --notes-file /tmp/release-notes.md \
              --latest
          fi
          echo "Release: https://github.com/$GITHUB_REPOSITORY/releases/tag/$tag"
          echo "APK: https://github.com/$GITHUB_REPOSITORY/releases/download/$tag/Gopeed-Gizli-Indirici.apk"
