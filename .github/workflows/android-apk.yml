name: Gopeed Original UI Privacy ARM64

on:
  push:
    branches: [main, restore-gopeed-ui-privacy-20261031]
  workflow_dispatch:

# Exactly one Android build/publisher runs at a time.
concurrency:
  group: gopeed-privacy-original-arm64-final-20261031
  cancel-in-progress: true

permissions:
  contents: write
  actions: write

jobs:
  build-android:
    name: Build original Gopeed multi-connection privacy APK
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.6'
          channel: stable
          cache: true

      - name: Build Go native library (ARM64 only)
        shell: bash
        run: |
          set -euo pipefail
          go install golang.org/x/mobile/cmd/gomobile@latest
          go get golang.org/x/mobile/bind
          gomobile init
          mkdir -p ui/flutter/android/app/libs
          gomobile bind \
            -tags nosqlite,privacyandroid \
            -ldflags="-w -s -checklinkname=0 -X github.com/GopeedLab/gopeed/pkg/base.Version=2.0.0-beta.4" \
            -o ui/flutter/android/app/libs/libgopeed.aar \
            -target=android/arm64 \
            -androidapi 21 \
            -javapkg=com.gopeed \
            github.com/GopeedLab/gopeed/bind/mobile

      - name: Fetch Flutter dependencies
        working-directory: ui/flutter
        run: flutter pub get

      - name: Build ARM64 release APK only
        working-directory: ui/flutter
        run: |
          flutter build apk --release --split-per-abi --target-platform android-arm64 \
            --dart-define=UPDATE_CHANNEL=androidApk \
            --dart-define=GOPEED_NO_EXTENSIONS=true \
            --dart-define=GOPEED_PRIVACY_MODE=true

      - name: Verify architecture and prepare latest APK
        shell: bash
        run: |
          set -euo pipefail
          source='ui/flutter/build/app/outputs/flutter-apk/app-arm64-v8a-release.apk'
          test -s "$source"
          unzip -Z1 "$source" | grep -qx 'lib/arm64-v8a/libgojni.so'
          if unzip -Z1 "$source" | grep -Eq '^lib/(armeabi-v7a|x86|x86_64)/'; then
            echo 'Unexpected non-ARM64 libraries found!' >&2
            exit 1
          fi
          mkdir -p dist
          cp "$source" dist/Gopeed-Privacy-Original-ARM64.apk
          sha256sum dist/Gopeed-Privacy-Original-ARM64.apk

      - name: Inspect Android manifest permissions
        shell: bash
        run: |
          set -euo pipefail
          apk='dist/Gopeed-Privacy-Original-ARM64.apk'
          aapt="$(find "$ANDROID_HOME/build-tools" -type f -name aapt -executable | sort -V | tail -n 1)"
          test -x "$aapt"
          "$aapt" dump permissions "$apk" | tee /tmp/gopeed-privacy-permissions.txt
          grep -q 'android.permission.INTERNET' /tmp/gopeed-privacy-permissions.txt
          if grep -Eq 'REQUEST_INSTALL_PACKAGES|READ_EXTERNAL_STORAGE|WRITE_EXTERNAL_STORAGE|READ_MEDIA_|MANAGE_EXTERNAL_STORAGE|READ_CONTACTS|READ_SMS|RECORD_AUDIO|CAMERA|ACCESS_FINE_LOCATION' /tmp/gopeed-privacy-permissions.txt; then
            echo 'Privacy build contains a forbidden Android permission' >&2
            exit 1
          fi

      - name: Upload one latest GitHub Actions artifact
        id: apk_artifact
        uses: actions/upload-artifact@v4
        with:
          name: Gopeed-Privacy-Original-ARM64-build
          path: dist/Gopeed-Privacy-Original-ARM64.apk
          if-no-files-found: error
          retention-days: 30
          overwrite: true

      - name: Publish APK as one stable GitHub Latest Release asset
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          tag='privacy-original-latest'
          apk='dist/Gopeed-Privacy-Original-ARM64.apk'
          title='Gopeed Original UI - Privacy Restricted Android ARM64'
          notes='Original Gopeed Flutter appearance, Settings and HTTP multi-connection downloader retained. Android-only privacy guards are compiled into the Go backend. No analytics, API server, updater, script, webhook, extensions, trackers, torrent or general storage/photo permissions. IMPORTANT: public Download MediaStore integration still requires verification before release.'
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$tag" "$apk" --repo "$GITHUB_REPOSITORY" --clobber
            gh release edit "$tag" --repo "$GITHUB_REPOSITORY" --title "$title" --notes "$notes" --latest
          else
            gh release create "$tag" "$apk" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "$title" \
              --notes "$notes" \
              --latest
          fi
          # Update the stable release tag to the source commit of this build.
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git tag -f "$tag" "$GITHUB_SHA"
          git push --force origin "refs/tags/$tag"

      - name: Delete all previous Gopeed APK artifacts
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          LATEST_ARTIFACT_ID: ${{ steps.apk_artifact.outputs.artifact-id }}
        shell: bash
        run: |
          set -euo pipefail
          # Preserve artifacts from unrelated test/release workflows.
          # Remove all older APK artifacts from earlier build/publish workflows.
          gh api --paginate "repos/$GITHUB_REPOSITORY/actions/artifacts?per_page=100" \
            --jq '.artifacts[] | select(.expired == false) | [.id, .name] | @tsv' |
          while IFS=$'\t' read -r artifact_id artifact_name; do
            case "$artifact_name" in
              Gopeed-Android-APKs|Gopeed-Android-NoExtensions-APKs|Gopeed-NoExtensions-ARM64-APK|Gopeed-Privacy-Original-ARM64-build)
                if [ "$artifact_id" != "$LATEST_ARTIFACT_ID" ]; then
                  echo "Deleting obsolete APK artifact $artifact_id ($artifact_name)"
                  gh api --method DELETE "repos/$GITHUB_REPOSITORY/actions/artifacts/$artifact_id"
                fi
                ;;
            esac
          done
          echo "Latest APK artifact: ${LATEST_ARTIFACT_ID}"
          echo "Permanent download: https://github.com/$GITHUB_REPOSITORY/releases/download/privacy-original-latest/Gopeed-Privacy-Original-ARM64.apk"
