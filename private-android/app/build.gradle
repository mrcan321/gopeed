plugins {
    id 'com.android.application' version '8.11.1'
}

android {
    namespace 'com.gopeed.privateonly'
    compileSdk 36

    defaultConfig {
        applicationId 'com.gopeed.privateonly'
        minSdk 29
        targetSdk 35
        versionCode 1
        versionName '1.0.0'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildTypes {
        release {
            // No signing credentials are stored in this public repository.
            // A new temporary signing key is created on each CI run. To update
            // in-place later, configure a private, stable signing key in CI.
            signingConfig signingConfigs.debug
            minifyEnabled false
        }
    }
}

// Deliberately no dependencies, SDKs, analytics, download engines or plugins.
dependencies {}
